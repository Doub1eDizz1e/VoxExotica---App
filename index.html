<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxExotica - AI Voice Lab & Studio</title>
    <meta name="description" content="Transform text into exotic, non-human, robotic, and demonic voices with real-time DSP effects, pitch modulation, and MP3 export." />
    <meta property="og:title" content="VoxExotica - AI Voice Lab & Studio" />
    <meta property="og:description" content="Transform text into exotic, non-human, robotic, and demonic voices with real-time DSP effects, pitch modulation, and MP3 export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // HMR is disabled in AI Studio - suppress WebSocket connection errors
      window.addEventListener('error', function(event) {
        if (
          (event.message && (
            event.message.includes('WebSocket') ||
            event.message.includes('createWebSocketModuleRunnerTransport') ||
            event.message.includes('failed to connect')
          )) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (
          reason && (
            (reason.message && (
              reason.message.includes('WebSocket') ||
              reason.message.includes('createWebSocketModuleRunnerTransport')
            )) ||
            (reason.stack && (
              reason.stack.includes('@vite/client') ||
              reason.stack.includes('createWebSocketModuleRunnerTransport')
            ))
          )
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
